<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#061527" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Bring the Lab Home</title>
  <style>
    :root{--navy:#061527;--gold:#d4af37;--white:#f8fafc;--muted:#b9c4d0}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--navy);color:var(--white);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;min-height:100vh;padding:28px}
    main{max-width:720px;text-align:center}
    .mark{width:58px;height:58px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;margin:0 auto 24px;color:var(--gold);font-weight:900;font-size:1.3rem}
    h1{margin:0 0 14px;font-size:clamp(2.4rem,8vw,5rem);line-height:.95;letter-spacing:-.04em}
    p{margin:0 auto;color:var(--muted);font-size:1.05rem;max-width:560px}
    strong{color:var(--gold)}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">N</div>
    <h1>BRING THE LAB HOME</h1>
    <p><strong>Offline for rebuild.</strong> The previous public version has been retired while the campaign page is rebuilt from the source material.</p>
  </main>
</body>
</html>
