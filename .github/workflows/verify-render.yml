name: Verify retired public site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render deploy
        run: sleep 75
      - name: Verify public site is retired
        run: |
          set -e
          URL="https://bring-the-lab-home.onrender.com/"
          echo "Checking $URL"
          status=$(curl -L -sS -o /tmp/page.html -w "%{http_code}" "$URL")
          echo "HTTP $status"
          test "$status" = "200"
          grep -qi "Offline for rebuild" /tmp/page.html
          if grep -qi "Frames from the .everything in storage. video" /tmp/page.html; then
            echo "OLD_STORAGE_CONTACT_SHEET_COPY_STILL_LIVE"
            exit 1
          fi
          echo "RETIRED_SITE_VERIFIED"
