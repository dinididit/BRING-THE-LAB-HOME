name: Diagnose fallback image payload

on:
  push:
    branches: [host-verification-2026-09-11]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect hero payload delivery
        run: |
          set -euo pipefail
          COMMIT="83a62e47a8a3eb4b226f78ee20fbf3707f7f46b4"
          BASE="https://raw.githack.com/dinididit/BRING-THE-LAB-HOME/$COMMIT"
          for asset in assets/data/hero-00.b64 assets/data/hero-rest.b64 assets/data/storage.b64; do
            echo "=== $asset ==="
            code=$(curl -L -sS -D /tmp/h -o /tmp/p -w "%{http_code}" "$BASE/$asset")
            echo "HTTP $code"
            grep -i '^content-type:' /tmp/h || true
            echo "bytes=$(wc -c < /tmp/p)"
            echo -n 'prefix='; head -c 80 /tmp/p | tr '\n\r' ' '; echo
          done
